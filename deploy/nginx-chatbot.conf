# Đoạn cấu hình THÊM vào cuối file docker/nginx/vinhsang.conf của VinhSang (trên server), ngay SAU khối chatadmin.benthanhtourist.com.
# Dùng lại 2 biến $btt_client_ip, $btt_conn_upgrade đã khai báo trong đoạn của chatadmin (btt-chat-admin/deploy/nginx-vinhsang-chat.conf),
# nên không khai báo lại (khai báo trùng thì nginx báo lỗi).
# Tên miền đi qua proxy Cloudflare (đám mây cam), SSL/TLS "Full", dùng chứng chỉ tự ký sẵn có như chatadmin.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chatbot.benthanhtourist.com;

    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # Ảnh/PDF khách gửi qua khung chat web tối đa 20 MB
    client_max_body_size 25M;

    # Docker DNS: nginx vẫn khởi động được khi container chatbot chưa chạy (VinhSang không bị kéo theo).
    resolver 127.0.0.11 valid=10s;

    location / {
        set $bttbot http://bttbot-chatbot-1:8000;
        proxy_pass $bttbot;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $btt_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        # Gemini có lúc trả lời chậm
        proxy_read_timeout 120s;
    }
}
