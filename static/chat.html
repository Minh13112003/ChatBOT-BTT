<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>bttAI — BenThanh Tourist</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; max-width: 640px; margin: 32px auto; background: #fff; color: #222; }
  .khung-chat { border: 1px solid #eee; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  .thanh-tieu-de { background: #E5252A; color: #fff; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }

  .khung-tin-nhan { height: 440px; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
  .dong { display: flex; }
  .dong.khach { justify-content: flex-end; }
  .bong-bong { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: .9rem; line-height: 1.5; white-space: pre-wrap; }
  .dong.khach .bong-bong { background: #E5252A; color: #fff; border-bottom-right-radius: 4px; }
  .dong.bot .bong-bong { background: #fff; border: 1px solid #eee; border-bottom-left-radius: 4px; }
  .con-tro-go { display: inline-block; width: 2px; height: 1em; background: #999; vertical-align: text-bottom; margin-left: 1px; animation: nhay-con-tro .8s infinite; }
  @keyframes nhay-con-tro { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
  .dang-suy-nghi { display: flex; align-items: center; gap: 8px; color: #888; font-style: italic; }
  .cham-suy-nghi { display: inline-flex; gap: 3px; }
  .cham-suy-nghi span { width: 6px; height: 6px; border-radius: 50%; background: #bbb; animation: nhay-cham 1.1s infinite ease-in-out; }
  .cham-suy-nghi span:nth-child(2) { animation-delay: .15s; }
  .cham-suy-nghi span:nth-child(3) { animation-delay: .3s; }
  @keyframes nhay-cham { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  .the-tour { display: block; margin-top: 8px; padding: 10px 12px; border-radius: 8px; background: #FFF8ED; border: 1px solid #F0D9B5; text-decoration: none; color: #222; }
  .the-tour b { display: block; color: #C81E23; }
  .the-tour .so-ngay-dem { display: block; margin-top: 2px; font-size: .8rem; color: #888; }
  .the-tour .ngay-khoi-hanh { display: block; margin-top: 2px; font-size: .8rem; color: #888; }
  .the-tour .con-cho { display: inline-block; margin-top: 4px; font-size: .76rem; font-weight: 700; padding: 2px 8px; border-radius: 100px; }
  .the-tour .con-cho.sap-het { background: #FDECEC; color: #C81E23; }
  .the-tour .con-cho.con-nhieu { background: #EAF6EC; color: #2f7d4f; }

  .goi-y-nhanh { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip-nhanh { border: 1px solid #F0B8B8; border-radius: 100px; padding: 6px 12px; font-size: .78rem; background: #fff; color: #C81E23; cursor: pointer; }
  .chip-nhanh:hover { background: #FFF4F4; }
  .nut-chon-dat { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .nut-chon-dat button { text-align: left; min-height: 44px; padding: 8px 14px; border: 1.5px solid #F0B8B8; border-radius: 14px; background: #fff; color: #C81E23; font-weight: 700; font-size: .85rem; cursor: pointer; }
  .nut-chon-dat button:hover:not(:disabled) { background: #FFF4F4; }
  .nut-chon-dat button.nut-dong-y { background: #C81E23; border-color: #C81E23; color: #fff; }
  .nut-chon-dat button.nut-huy { color: #777; border-color: #ddd; }
  .nut-chon-dat button:disabled { opacity: .55; cursor: not-allowed; }

  .the-handoff { display: block; margin-top: 10px; padding: 12px 14px; border-radius: 10px; background: #E8F5EA; border: 1px solid #B7E0BE; text-decoration: none; color: #1d5a2e; }
  .the-handoff .nhan-zalo { display: flex; align-items: center; gap: 6px; font-weight: 700; color: #0b5f2f; }
  .the-handoff .tom-tat { display: block; margin-top: 6px; font-size: .8rem; color: #3d6b47; line-height: 1.5; }

  .goi-y { border-top: 1px solid #eee; }
  .goi-y-tieu-de { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; cursor: pointer; font-size: .8rem; color: #666; font-weight: 600; user-select: none; }
  .goi-y-tieu-de .mui-ten { transition: transform .15s; }
  .goi-y-tieu-de .mui-ten.dong { transform: rotate(-90deg); }
  .goi-y-danh-sach { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
  .chip-goi-y { border: 1px solid #ddd; border-radius: 100px; padding: 7px 14px; font-size: .82rem; background: #fff; color: #333; cursor: pointer; }
  .chip-goi-y:hover { background: #FFF4F4; border-color: #E5252A; color: #C81E23; }
  .chip-goi-y:disabled { opacity: .5; cursor: not-allowed; }

  .khung-nhap { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #eee; align-items: flex-end; }
  .khung-nhap textarea { flex: 1; padding: 10px 14px; border-radius: 18px; border: 1px solid #ddd; font-family: inherit; font-size: 1rem; resize: none; max-height: 120px; line-height: 1.4; }
  .tep-dinh-kem { display: block; margin: 0 0 6px; }
  .tep-dinh-kem img { display: block; max-width: 100%; max-height: 260px; border-radius: 10px; background: #fff; }
  .tep-pdf { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 6px 10px; border-radius: 10px; background: #fff; color: #222; text-decoration: none; font-size: .85rem; font-weight: 600; word-break: break-all; }
  .nut-dinh-kem { width: 44px; height: 44px; padding: 0 !important; display: flex; align-items: center; justify-content: center; background: #fff !important; color: #E5252A !important; border: 1px solid #ddd !important; }
  .nut-dinh-kem:disabled { color: #bbb !important; }
  .luu-y-tep { padding: 0 16px 8px; font-size: .75rem; color: #777; }
  .khung-nhap button { border: none; border-radius: 100px; padding: 10px 18px; background: #E5252A; color: #fff; font-weight: 700; cursor: pointer; flex: none; }
  .khung-nhap button:disabled { background: #ccc; }

  .form-khach { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-top: 1px solid #eee; }
  .form-khach label { display: flex; flex-direction: column; gap: 4px; font-size: .82rem; font-weight: 600; color: #444; }
  .form-khach input { min-height: 44px; padding: 8px 12px; border: 1px solid #ddd; border-radius: 10px; font: inherit; font-weight: 400; }
  .form-khach button { min-height: 44px; border: none; border-radius: 10px; background: #E5252A; color: #fff; font-weight: 700; cursor: pointer; }
  .form-khach button:disabled { background: #ccc; }
  .form-khach .loi { margin: 0; font-size: .82rem; color: #B30118; }
  .nhan-nhan-vien { display: block; margin-bottom: 2px; font-size: .75rem; font-weight: 700; color: #B30118; }

</style>
</head>
<body>
<div id="app">
  <div class="khung-chat">
    <div class="thanh-tieu-de">
      <div>bttAI — BenThanh Tourist</div>
    </div>

    <div class="khung-tin-nhan" ref="khungTinNhan">
      <div v-for="(tin, i) in danhSachTinNhan" :key="i" class="dong" :class="tin.vaiTro === 'user' ? 'khach' : 'bot'">
        <div class="bong-bong"><span v-if="tin.nhanVien" class="nhan-nhan-vien">Nhân viên BenThanh Tourist</span>
          <a v-if="tin.tep" class="tep-dinh-kem" :href="tin.tep.url" target="_blank" rel="noopener">
            <img v-if="tin.tep.type.startsWith('image/')" :src="tin.tep.url" :alt="tin.tep.name" loading="lazy" @load="cuonXuongDuoi">
            <span v-else class="tep-pdf">PDF · {{ tin.tep.name }}</span>
          </a>{{ tin.noiDung }}<span v-if="tin.dangGoChu" class="con-tro-go"></span>
          <template v-if="!tin.dangGoChu">
            <a v-for="t in tin.tours" :key="t.id" class="the-tour" :href="t.url" target="_blank">
              <b>{{ t.ten }}</b>{{ t.gia != null ? t.gia.toLocaleString('vi-VN') + 'đ' : 'Xem chi tiết' }}
              <span v-if="t.so_ngay" class="so-ngay-dem">{{ t.so_ngay }} ngày {{ t.so_ngay - 1 }} đêm</span>
              <span v-if="ngayKhoiHanhGanNhat(t)" class="ngay-khoi-hanh">{{ nhanNgayKhoiHanh(t, tin.tours) }} {{ ngayKhoiHanhGanNhat(t) }}</span>
              <span v-if="nhanConCho(t)" class="con-cho" :class="t.so_cho_con <= 5 ? 'sap-het' : 'con-nhieu'">{{ nhanConCho(t) }}</span>
            </a>
            <div v-if="tin.goiY && tin.goiY.length" class="goi-y-nhanh">
              <button
                v-for="cau in tin.goiY" :key="cau"
                class="chip-nhanh" type="button"
                :disabled="dangChoPhanHoi"
                @click="guiCauHoi(cau)"
              >{{ cau }}</button>
            </div>
            <div v-if="tin.choices && tin.choices.length" class="nut-chon-dat">
              <button
                v-for="c in tin.choices" :key="c.id" type="button"
                :class="{ 'nut-dong-y': c.id === 'xn:dong_y', 'nut-huy': c.id === 'huy' }"
                :disabled="dangChoPhanHoi || tin.daTraLoi || i !== danhSachTinNhan.length - 1"
                @click="guiCauHoi(c.label, { id: c.id, label: c.label }, tin)"
              >{{ c.label }}</button>
            </div>
            <a v-if="tin.handoff" class="the-handoff" :href="tin.handoff.zalo_url" target="_blank">
              <span class="nhan-zalo">💬 Nhắn Zalo nhân viên CSKH ngay</span>
              <span v-if="tin.handoff.tom_tat" class="tom-tat">Nhân viên đã có tóm tắt: “{{ tin.handoff.tom_tat }}”</span>
            </a>
          </template>
        </div>
      </div>
      <div v-if="dangChoPhanHoiTuServer" class="dong bot">
        <div class="bong-bong dang-suy-nghi">
          bttAI đang suy nghĩ, bạn chờ chút nha
          <span class="cham-suy-nghi"><span></span><span></span><span></span></span>
        </div>
      </div>
    </div>

    <form v-if="!daDinhDanh" class="form-khach" @submit.prevent="guiThongTin">
      <label>Họ và tên
        <input v-model="tenKhach" autocomplete="name" maxlength="120" required>
      </label>
      <label>Số điện thoại
        <input v-model="sdtKhach" type="tel" autocomplete="tel" maxlength="30" required>
      </label>
      <p v-if="loiDinhDanh" class="loi" role="alert">{{ loiDinhDanh }}</p>
      <button :disabled="dangGuiThongTin">{{ dangGuiThongTin ? 'Đang gửi...' : 'Bắt đầu trò chuyện' }}</button>
    </form>

    <template v-else>
    <div class="goi-y">
      <div class="goi-y-tieu-de" @click="moGoiY = !moGoiY">
        <span>Gợi ý câu hỏi</span>
        <span class="mui-ten" :class="{ dong: !moGoiY }">▾</span>
      </div>
      <div class="goi-y-danh-sach" v-if="moGoiY">
        <button
          v-for="cau in cacCauGoiY" :key="cau"
          class="chip-goi-y" type="button"
          :disabled="dangChoPhanHoi"
          @click="guiCauHoi(cau)"
        >{{ cau }}</button>
      </div>
    </div>

    <div class="luu-y-tep">Bạn có thể gửi ảnh (JPG, PNG, WebP) hoặc PDF cho nhân viên. Vui lòng không gửi ảnh CCCD, hộ chiếu nếu chưa cần thiết.</div>
    <form class="khung-nhap" @submit.prevent="guiCauHoi()">
      <input ref="oChonTep" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" hidden @change="chonTep">
      <button type="button" class="nut-dinh-kem" :disabled="dangChoPhanHoi" aria-label="Đính kèm ảnh hoặc PDF" @click="oChonTep.click()">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21 12-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
      </button>
      <textarea
        ref="oNhap"
        v-model="cauHoiDangNhap"
        :disabled="dangChoPhanHoi"
        placeholder="Nhập câu hỏi của bạn..."
        rows="1"
        @input="tuGianONhap"
        @keydown.enter.exact.prevent="guiCauHoi()"
      ></textarea>
      <button :disabled="dangChoPhanHoi">{{ dangChoPhanHoi ? '...' : 'Gửi' }}</button>
    </form>
    </template>
  </div>
</div>

<script>
const { createApp, ref, nextTick } = Vue;

createApp({
  setup() {
    let conversationId = ref(localStorage.getItem("bttai_conversation_id") || crypto.randomUUID());
    localStorage.setItem("bttai_conversation_id", conversationId.value);

    // Bộ nhớ trình duyệt có thể bị chặn (tab ẩn danh): lỗi đọc ghi không được làm hỏng trang.
    function docKho(khoa) {
      try { return localStorage.getItem(khoa); } catch (e) { return null; }
    }
    function ghiKho(khoa, giaTri) {
      try {
        if (giaTri === null) localStorage.removeItem(khoa);
        else localStorage.setItem(khoa, giaTri);
      } catch (e) {}
    }

    // Mã ngẫu nhiên theo thiết bị. Khách web không đăng nhập, máy chủ nhận ra khách qua mã này.
    const maThietBi = docKho("bttai_device_id") || crypto.randomUUID();
    ghiKho("bttai_device_id", maThietBi);

    const CAU_CHAO = "Xin chào, mình là bttAI, trợ lý tour của BenThanh Tourist. Bạn cho mình xin họ tên và số điện thoại để thuận tiện cho việc tư vấn và liên hệ nhé.";
    const CAU_MOI_HOI = "Cảm ơn bạn. Bạn muốn đi đâu, vào tháng nào và ngân sách khoảng bao nhiêu?";
    const BA_NGAY_MS = 3 * 24 * 3600 * 1000;

    function docTinDaLuu() {
      try {
        const tin = JSON.parse(docKho("bttai_tin_nhan") || "[]");
        return Array.isArray(tin) ? tin.filter((t) => Date.now() - (t.luc || 0) < BA_NGAY_MS) : [];
      } catch (e) {
        return [];
      }
    }
    function luuTin() {
      const giuLai = danhSachTinNhan.value.filter((t) => !t.dangGoChu).slice(-50).map((t) => (t.tamThoi && t.tep ? { ...t, tep: null, noiDung: t.noiDung || "[Bạn đã gửi một file]" } : t));
      ghiKho("bttai_tin_nhan", JSON.stringify(giuLai));
    }

    const daDinhDanh = ref(docKho("bttai_da_dinh_danh") === "1");
    const tenKhach = ref("");
    const sdtKhach = ref("");
    const loiDinhDanh = ref("");
    const dangGuiThongTin = ref(false);
    const tinDaLuu = daDinhDanh.value ? docTinDaLuu() : [];
    const danhSachTinNhan = ref(tinDaLuu.length ? tinDaLuu : [
      { vaiTro: "bot", noiDung: daDinhDanh.value ? CAU_MOI_HOI : CAU_CHAO, tours: [], luc: Date.now() },
    ]);

    // Tin nhân viên trả lời từ trang quản trị. Con trỏ do máy chủ cấp nên không phụ thuộc đồng hồ của máy khách.
    let conTro = docKho("bttai_con_tro");
    let dangHoiTinNhanVien = false;
    let daBatHoiTin = false;
    async function hoiTinNhanVien() {
      if (dangHoiTinNhanVien) return;
      dangHoiTinNhanVien = true;
      try {
        const thamSo = new URLSearchParams({ device_id: maThietBi });
        if (conTro) thamSo.set("after", conTro);
        const res = await fetch("/web/updates?" + thamSo);
        if (!res.ok) return;
        const data = await res.json();
        conTro = data.cursor || conTro;
        if (conTro) ghiKho("bttai_con_tro", conTro);
        if (data.items && data.items.length) {
          for (const t of data.items) {
            danhSachTinNhan.value.push({ vaiTro: "bot", noiDung: t.text, tours: [], nhanVien: true, tep: t.attachment || null, luc: Date.now() });
          }
          luuTin();
          cuonXuongDuoi();
        }
      } catch (e) {
        // Lỗi mạng: lần sau hỏi lại từ mốc cũ.
      } finally {
        dangHoiTinNhanVien = false;
      }
    }
    function batDauNhanTinNhanVien() {
      if (daBatHoiTin) return;
      daBatHoiTin = true;
      hoiTinNhanVien();
      setInterval(hoiTinNhanVien, 5000);
    }

    async function guiThongTin() {
      if (dangGuiThongTin.value) return;
      dangGuiThongTin.value = true;
      loiDinhDanh.value = "";
      try {
        const res = await fetch("/web/identify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ device_id: maThietBi, name: tenKhach.value, phone: sdtKhach.value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          loiDinhDanh.value = data.message || "Thông tin chưa hợp lệ, bạn kiểm tra lại giúp mình nhé.";
          return;
        }
        // Máy khác nhập trùng số: không hiện tin cũ, chỉ nhận tin nhân viên gửi từ bây giờ.
        if (!data.load_history) {
          conTro = null;
          ghiKho("bttai_con_tro", null);
        }
        daDinhDanh.value = true;
        ghiKho("bttai_da_dinh_danh", "1");
        danhSachTinNhan.value.push({ vaiTro: "bot", noiDung: CAU_MOI_HOI, tours: [], luc: Date.now() });
        luuTin();
        batDauNhanTinNhanVien();
        cuonXuongDuoi();
      } catch (e) {
        loiDinhDanh.value = "Mình chưa kết nối được. Bạn kiểm tra mạng rồi thử lại nhé.";
      } finally {
        dangGuiThongTin.value = false;
      }
    }
    if (daDinhDanh.value) batDauNhanTinNhanVien();
    const cauHoiDangNhap = ref("");
    const dangChoPhanHoi = ref(false);
    // Riêng cho bong bóng "đang suy nghĩ" — bật khi vừa gửi request, tắt
    // ngay khi nhận được response (trước khi bắt đầu gõ chữ dần).
    const dangChoPhanHoiTuServer = ref(false);
    const khungTinNhan = ref(null);
    const oNhap = ref(null);

    // <textarea> tự giãn chiều cao theo nội dung (đến max-height trong CSS,
    // phần dư sẽ cuộn) — thay cho <input> chỉ cuộn ngang khi gõ dài.
    function tuGianONhap() {
      const el = oNhap.value;
      if (!el) return;
      el.style.height = "auto";
      el.style.height = el.scrollHeight + "px";
    }

    // Gợi ý cố định — bấm vào sẽ tự gửi đúng câu này, bot tự tra cứu dữ liệu
    // tour thật (qua ChromaDB, xem rag.py) chứ không phải link tĩnh.
    const moGoiY = ref(true);
    const cacCauGoiY = ref([
      "Có tour nào độc lạ, ít người biết không?",
      "Tour trong nước giá tốt",
      "Tour nước ngoài đang có",
      "Tour phù hợp đi cùng gia đình có trẻ nhỏ",
    ]);

    // ngay_khoi_hanh là chuỗi "2026-09-22,2026-09-22,..." (đã sort tăng dần,
    // có thể trùng ngày do nhiều suất) — chỉ cần ngày đầu tiên (gần nhất).
    function ngayKhoiHanhGanNhat(tour) {
      if (!tour.ngay_khoi_hanh) return "";
      const ngayDau = tour.ngay_khoi_hanh.split(",")[0];
      const [nam, thang, ngay] = ngayDau.split("-");
      if (!nam || !thang || !ngay) return "";
      return `${ngay}/${thang}/${nam}`;
    }

    // Bình thường (1 thẻ/tên tour) -> "Khởi hành gần nhất:" đúng nghĩa.
    // Khi khách hỏi "ngày khác" và backend trả về NHIỀU thẻ CÙNG TÊN tour
    // (mỗi thẻ là 1 lượt khởi hành riêng, xem rag.py) -> mỗi thẻ chỉ có ĐÚNG
    // 1 ngày cụ thể của lượt đó, không còn là "gần nhất trong nhiều lựa
    // chọn" nữa -> đổi nhãn thành "Khởi hành:" cho đỡ gây hiểu lầm.
    function nhanNgayKhoiHanh(tour, danhSachTours) {
      const soLanTrungTen = danhSachTours.filter((t) => t.ten === tour.ten).length;
      return soLanTrungTen > 1 ? "Khởi hành:" : "Khởi hành gần nhất:";
    }

    // Chỉ hiện nhãn chỗ còn khi backend có trả field này (tour cũ đồng bộ
    // trước khi thêm so_cho_con sẽ không có field -> undefined, ẩn nhãn thay
    // vì hiện "0 chỗ" sai sự thật).
    function nhanConCho(tour) {
      if (tour.so_cho_con === undefined || tour.so_cho_con === null) return "";
      if (tour.so_cho_con <= 0) return "";
      return tour.so_cho_con <= 5 ? `Chỉ còn ${tour.so_cho_con} chỗ!` : `Còn ${tour.so_cho_con} chỗ`;
    }

    async function cuonXuongDuoi() {
      await nextTick();
      if (khungTinNhan.value) khungTinNhan.value.scrollTop = khungTinNhan.value.scrollHeight;
    }

    // Giả lập hiệu ứng gõ chữ ở FRONTEND — backend vẫn trả lời đủ 1 lần
    // (không streaming thật), chỉ hiện dần từng ký tự cho cảm giác tự nhiên.
    const TOC_DO_GO_MS = 9; // càng nhỏ càng gõ nhanh (đã tăng gấp đôi tốc độ theo yêu cầu)

    function goChuDan(tin, vanBanDayDu) {
      return new Promise((giaiQuyet) => {
        let viTri = 0;
        const dem = setInterval(() => {
          viTri += 1;
          tin.noiDung = vanBanDayDu.slice(0, viTri);
          cuonXuongDuoi();
          if (viTri >= vanBanDayDu.length) {
            clearInterval(dem);
            tin.dangGoChu = false;
            giaiQuyet();
          }
        }, TOC_DO_GO_MS);
      });
    }

    const oChonTep = ref(null);
    const GIOI_HAN_ANH = 10 * 1024 * 1024;
    const GIOI_HAN_PDF = 20 * 1024 * 1024;
    async function chonTep(e) {
      const tep = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!tep || dangChoPhanHoi.value) return;
      const laAnh = ["image/jpeg", "image/png", "image/webp"].includes(tep.type);
      let loi = "";
      if (!laAnh && tep.type !== "application/pdf") loi = "Chỉ gửi được ảnh (JPG, PNG, WebP) hoặc file PDF.";
      else if (laAnh && tep.size > GIOI_HAN_ANH) loi = "Ảnh quá lớn, tối đa 10 MB.";
      else if (!laAnh && tep.size > GIOI_HAN_PDF) loi = "File PDF quá lớn, tối đa 20 MB.";
      if (loi) {
        danhSachTinNhan.value.push({ vaiTro: "bot", noiDung: loi, tours: [], luc: Date.now() });
        return cuonXuongDuoi();
      }
      const chu = cauHoiDangNhap.value.trim();
      // Ảnh xem trước dùng đường dẫn tạm của trình duyệt; không lưu vào kho vì đường dẫn này mất khi tải lại trang.
      danhSachTinNhan.value.push({ vaiTro: "user", noiDung: chu, tep: { url: laAnh ? URL.createObjectURL(tep) : "#", type: tep.type, name: tep.name }, tamThoi: true, luc: Date.now() });
      cauHoiDangNhap.value = "";
      nextTick(tuGianONhap);
      dangChoPhanHoi.value = true;
      dangChoPhanHoiTuServer.value = true;
      cuonXuongDuoi();
      try {
        const f = new FormData();
        f.append("device_id", maThietBi);
        f.append("message", chu);
        f.append("file", tep);
        const res = await fetch("/web/attachment", { method: "POST", body: f });
        if (res.status === 403) {
          daDinhDanh.value = false;
          ghiKho("bttai_da_dinh_danh", null);
          danhSachTinNhan.value.push({ vaiTro: "bot", noiDung: CAU_CHAO, tours: [], luc: Date.now() });
          return;
        }
        let data = null;
        try { data = await res.json(); } catch (e) { /* không phải JSON */ }
        if (!res.ok) {
          const loiMay = (data && data.message) || (res.status === 429 ? "Bạn thao tác hơi nhanh, thử lại sau ít phút nhé." : "Hiện chưa gửi được ảnh hoặc file, bạn thử lại sau ít phút nhé.");
          danhSachTinNhan.value.push({ vaiTro: "bot", noiDung: loiMay, tours: [], luc: Date.now() });
          return;
        }
        if (data.che_do === "STAFF" && !data.reply) return;
        danhSachTinNhan.value.push({ vaiTro: "bot", noiDung: data.reply, tours: [], luc: Date.now() });
      } catch (e) {
        danhSachTinNhan.value.push({ vaiTro: "bot", noiDung: "Mình chưa kết nối được. Bạn kiểm tra mạng rồi thử lại nhé.", tours: [], luc: Date.now() });
      } finally {
        luuTin();
        dangChoPhanHoiTuServer.value = false;
        dangChoPhanHoi.value = false;
        cuonXuongDuoi();
      }
    }

    // hanhDong: nút của luồng đặt tour ({ id, label }); tinCoNut: tin chứa nút, khoá lại để không bấm lại nút của bước cũ.
    async function guiCauHoi(cauGoiY, hanhDong, tinCoNut) {
      const cauHoi = (cauGoiY ?? cauHoiDangNhap.value).trim();
      if (!cauHoi || dangChoPhanHoi.value) return;
      if (tinCoNut) tinCoNut.daTraLoi = true;
      danhSachTinNhan.value.push({ vaiTro: "user", noiDung: cauHoi, luc: Date.now() });
      luuTin();
      cauHoiDangNhap.value = "";
      nextTick(tuGianONhap); // gửi xong -> ô nhập rỗng -> co lại về 1 dòng
      dangChoPhanHoi.value = true;
      dangChoPhanHoiTuServer.value = true;
      cuonXuongDuoi();

      if (cauHoi === "/clear") {
        conversationId.value = crypto.randomUUID();
        localStorage.setItem("bttai_conversation_id", conversationId.value);
        danhSachTinNhan.value = [{
          vaiTro: "bot",
          noiDung: "Đã làm mới cuộc trò chuyện. Bạn cần tư vấn tour gì ạ?",
          tours: [],
          luc: Date.now(),
        }];
        luuTin();
        dangChoPhanHoiTuServer.value = false;
        dangChoPhanHoi.value = false;
        cuonXuongDuoi();
        return;
      }

      try {
        const res = await fetch("/web/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            device_id: maThietBi, conversation_id: conversationId.value,
            ...(hanhDong ? { message: "", action: { id: hanhDong.id, label: hanhDong.label } } : { message: cauHoi }),
          }),
        });

        if (res.status === 403) {
          // Máy chủ chưa có tên + SĐT của thiết bị này: hỏi lại, không giải đáp.
          daDinhDanh.value = false;
          ghiKho("bttai_da_dinh_danh", null);
          danhSachTinNhan.value.push({ vaiTro: "bot", noiDung: CAU_CHAO, tours: [], luc: Date.now() });
          return;
        }
        if (!res.ok) {
          danhSachTinNhan.value.push({ vaiTro: "bot", noiDung: res.status === 429 ? "Bạn thao tác hơi nhanh, thử lại sau ít phút nhé." : "Trợ lý đang bận, bạn thử lại sau ít phút nhé.", tours: [], luc: Date.now() });
          return;
        }

        const data = await res.json();
        // Nhân viên đang xử lý: bot im lặng, tin nhân viên đến qua hoiTinNhanVien().
        if (data.che_do === "STAFF" && !data.reply) return;
        dangChoPhanHoiTuServer.value = false; // tắt "đang suy nghĩ", chuyển sang gõ chữ
        danhSachTinNhan.value.push({ vaiTro: "bot", noiDung: "", tours: data.tours, goiY: data.goi_y, choices: data.choices, handoff: data.handoff, dangGoChu: true, luc: Date.now() });
        // Lấy lại tham chiếu TỪ mảng reactive (không dùng object vừa tạo ở trên)
        // để chắc chắn Vue theo dõi đúng thay đổi khi gõ dần từng ký tự.
        const tin = danhSachTinNhan.value[danhSachTinNhan.value.length - 1];
        await goChuDan(tin, data.reply);
      } catch (e) {
        danhSachTinNhan.value.push({ vaiTro: "bot", noiDung: "Mình chưa kết nối được. Bạn kiểm tra mạng rồi thử lại nhé.", tours: [], luc: Date.now() });
      } finally {
        luuTin();
        dangChoPhanHoiTuServer.value = false;
        dangChoPhanHoi.value = false;
        cuonXuongDuoi();
      }
    }

    return { oChonTep, chonTep, danhSachTinNhan, cauHoiDangNhap, dangChoPhanHoi, dangChoPhanHoiTuServer, khungTinNhan, oNhap, tuGianONhap, moGoiY, cacCauGoiY, guiCauHoi, ngayKhoiHanhGanNhat, nhanNgayKhoiHanh, nhanConCho, daDinhDanh, tenKhach, sdtKhach, loiDinhDanh, dangGuiThongTin, guiThongTin };
  },
}).mount("#app");
</script>

</html>
